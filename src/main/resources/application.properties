spring.application.name=demo
# Local .env must use unquoted Java-properties-compatible KEY=value entries.
spring.config.import=optional:file:./.env[.properties]
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Actuator endpoints used during local observability checks.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Trace every local request. Lower this value in production.
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.sampler=parent-based-trace-id-ratio
management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:ad-studio}
management.opentelemetry.resource-attributes.deployment.environment=${APP_ENVIRONMENT:local}

# OTLP traces -> OpenTelemetry Collector / Grafana Tempo.
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORT_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# Micrometer metrics -> OTLP / Grafana Mimir.
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:true}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=10s

# Include trace/span IDs in application logs without recording prompt content.
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
logging.include-application-name=false

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.model.image=openai

spring.ai.openai.timeout=180s
spring.ai.openai.max-retries=1

spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
spring.ai.image.observations.log-prompt=true

logging.level.org.springframework.ai=DEBUG

management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.opentelemetry.logging.export.otlp.transport=http
management.opentelemetry.logging.export.schedule-delay=1s

# PostgreSQL is required at runtime; H2 is available only to tests.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${DB_PORT:5432}/${DB_NAME:adwflow}}
spring.datasource.username=${DB_USERNAME:adwflow}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.name=${ADMIN_BOOTSTRAP_NAME:}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

ad-studio.visual.model=${AD_STUDIO_VISUAL_MODEL:gpt-image-2}
ad-studio.visual.quality=${AD_STUDIO_VISUAL_QUALITY:medium}

# Private persistent media files; never place this directory under static resources.
app.media.root=${ADWFLOW_MEDIA_ROOT:./data/generated-images}
app.works.retention=${ADWFLOW_WORK_RETENTION:P30D}

# Redis contains temporary security state, never application entities or raw credentials.
spring.data.redis.client-type=jedis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.repositories.enabled=false
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.max-wait=2s
app.security.redis.key-prefix=${REDIS_KEY_PREFIX:adwflow:security}
app.security.redis.hmac-secret=${AUTH_HMAC_SECRET:}
app.security.redis.verify-startup=${REDIS_VERIFY_STARTUP:true}
app.security.redis.verification-ttl=${AUTH_VERIFICATION_TTL:PT10M}
app.security.redis.reset-ttl=${AUTH_RESET_TTL:PT15M}
app.security.redis.resend-cooldown=${AUTH_RESEND_COOLDOWN:PT1M}
app.security.redis.max-attempts=5
app.security.redis.request-window=PT1H
app.security.redis.email-request-limit=5
app.security.redis.ip-request-limit=20
app.security.redis.confirm-window=PT15M
app.security.redis.ip-confirm-limit=100
