spring.application.name=demo
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Actuator endpoints used during local observability checks.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Trace every local request. Lower this value in production.
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.sampler=parent-based-trace-id-ratio
management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:ad-studio},deployment.environment=${APP_ENVIRONMENT:local}

# OTLP traces -> OpenTelemetry Collector / Grafana Tempo.
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORT_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

# Micrometer metrics -> OTLP / Grafana Mimir.
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:true}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=10s

# Include trace/span IDs in application logs without recording prompt content.
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
logging.include-application-name=false
