<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="workspace-navigation" th:fragment="navigation">
    <a class="brand workspace-brand" th:href="@{/}" aria-label="AdwFlow home">
        <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m12 2 1.5 5.2a4.6 4.6 0 0 0 3.2 3.2L22 12l-5.3 1.6a4.6 4.6 0 0 0-3.2 3.2L12 22l-1.5-5.2a4.6 4.6 0 0 0-3.2-3.2L2 12l5.3-1.6a4.6 4.6 0 0 0 3.2-3.2L12 2Z"/></svg>
        </span>
        <span>AdwFlow</span>
    </a>
    <nav class="workspace-links" aria-label="Workspace navigation">
        <p class="workspace-nav-label">Workspace</p>
        <a class="workspace-nav-link is-current" th:href="@{/dashboard}" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Dashboard</span>
        </a>
        <a class="workspace-nav-link" th:if="${currentUser.admin}" th:href="@{/admin}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 8 3v5c0 5-4 8-8 10-4-2-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
            <span>Admin</span>
        </a>
    </nav>
    <div class="workspace-sidebar-bottom">
        <a class="workspace-nav-link workspace-help" th:href="@{/#workflow}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-1 .7-1.7 1.1-1.7 2.7M12 16.5v1"/></svg>
            <span>How it works</span><span class="workspace-external-mark" aria-hidden="true">↗</span>
        </a>
        <div class="workspace-account">
            <span class="workspace-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span>
            <div class="workspace-account-copy">
                <span class="workspace-account-name" th:text="${currentUser.displayName}">Creator</span>
                <span class="workspace-account-role" th:text="${currentUser.admin ? 'Administrator' : 'Personal workspace'}">Personal workspace</span>
            </div>
        </div>
        <form class="workspace-logout" th:action="@{/logout}" method="post" data-logout-form>
            <button class="workspace-nav-link" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 4H5v16h5M9 12h12m-4-4 4 4-4 4"/></svg>
                <span data-logout-label>Logout</span>
            </button>
            <span class="workspace-sr-only" role="status" data-logout-status></span>
        </form>
    </div>
</div>
</body>
</html>
