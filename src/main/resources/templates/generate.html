<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Transform your advertising ideas into engaging content.">
    <title>Generate Add</title>
    <link rel="stylesheet" href="/css/generate.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Return to homepage">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
                        <path d="m12 2 1.5 5.2a4.6 4.6 0 0 0 3.2 3.2L22 12l-5.3 1.6a4.6 4.6 0 0 0-3.2 3.2L12 22l-1.5-5.2a4.6 4.6 0 0 0-3.2-3.2L2 12l5.3-1.6a4.6 4.6 0 0 0 3.2-3.2L12 2Z"/>
                    </svg>
                </span>
                Ad Studio
            </a>
            <span class="status"><span class="status-dot"></span> AI is ready</span>
        </header>

        <main>
            <section class="generator" aria-labelledby="page-title">
                <div class="sparkle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="m12 3 1.25 4.3a4.3 4.3 0 0 0 2.95 2.95L20.5 11.5l-4.3 1.25a4.3 4.3 0 0 0-2.95 2.95L12 20l-1.25-4.3a4.3 4.3 0 0 0-2.95-2.95L3.5 11.5l4.3-1.25a4.3 4.3 0 0 0 2.95-2.95L12 3Z"/>
                        <path d="m19 3 .45 1.55A1.5 1.5 0 0 0 20.5 5.6L22 6l-1.5.4a1.5 1.5 0 0 0-1.05 1.05L19 9l-.45-1.55A1.5 1.5 0 0 0 17.5 6.4L16 6l1.5-.4a1.5 1.5 0 0 0 1.05-1.05L19 3Z"/>
                    </svg>
                </div>

                <h1 id="page-title">Generate Add</h1>
                <p class="subtitle">
                    Describe your product, target audience, and message;
                    we will turn your idea into compelling ad copy.
                </p>

                <form class="composer" id="generate-form" novalidate>
                    <div class="attachments" id="attachments" aria-label="Uploaded images" aria-live="polite" hidden></div>

                    <div class="input-wrap">
                        <label for="ad-prompt" hidden>Ad description</label>
                        <textarea
                            id="ad-prompt"
                            name="prompt"
                            rows="5"
                            placeholder="For example: Create an energetic Instagram ad for our next-generation wireless headphones that appeals to a young audience..."
                            aria-describedby="word-counter keyboard-hint"
                        ></textarea>
                        <div class="input-meta">
                            <span class="keyboard-hint" id="keyboard-hint"><kbd>Shift</kbd> + <kbd>Enter</kbd> new line</span>
                            <span class="word-counter" id="word-counter" aria-live="polite">0/5000</span>
                        </div>
                    </div>

                    <div class="composer-actions">
                        <div class="attachment-control">
                            <button
                                class="add-button"
                                id="attachment-toggle"
                                type="button"
                                aria-label="Add an attachment"
                                aria-expanded="false"
                                aria-controls="attachment-menu"
                            >
                                <span class="plus-icon" aria-hidden="true">+</span>
                            </button>

                            <div class="attachment-menu" id="attachment-menu" role="menu" aria-hidden="true">
                                <button class="upload-option" id="upload-images-button" type="button" role="menuitem">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                                        <rect x="3" y="4" width="18" height="16" rx="3"/>
                                        <circle cx="8.5" cy="9" r="1.5"/>
                                        <path d="m5 17 4.5-4.5 3.2 3.2 2.1-2.1L19 17.8"/>
                                    </svg>
                                    Upload Images
                                </button>
                            </div>

                            <input
                                class="file-input"
                                id="image-input"
                                name="images"
                                type="file"
                                accept="image/*"
                                multiple
                            >
                        </div>

                        <button class="submit-button" type="submit">
                            Generate Ad
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M5 12h14M13 6l6 6-6 6"/>
                            </svg>
                        </button>
                    </div>
                </form>

                <p class="privacy-note">Your input is used only to generate your advertisement.</p>
            </section>
        </main>
    </div>

    <script src="/js/generate.js"></script>
</body>
</html>
