<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — AdwFlow</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/brand-motion.css}">
    <script th:src="@{/js/brand-motion.js}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <header th:replace="~{fragments/navigation :: header}"></header>
    <main id="main-content" class="account-single container">
        <section class="account-card admin-card" aria-labelledby="admin-title">
            <span class="role-badge">Admin workspace</span>
            <h1 id="admin-title">Welcome, <span th:text="${currentUser.displayName}"></span>.</h1>
            <p class="card-description">Your secure corner of AdwFlow. You are signed in with administrator access.</p>
            <dl class="account-details">
                <div><dt>Name</dt><dd th:text="${currentUser.displayName}"></dd></div>
                <div><dt>Email address</dt><dd th:text="${currentUser.email}"></dd></div>
                <div><dt>Access level</dt><dd>Administrator</dd></div>
            </dl>
            <div class="panel-actions">
                <a class="button button-primary" th:href="@{/}">Back to home <span aria-hidden="true">→</span></a>
                <form class="logout-form" th:action="@{/logout}" method="post"><button class="button button-secondary" type="submit">Logout</button></form>
            </div>
        </section>
    </main>
</body>
</html>
