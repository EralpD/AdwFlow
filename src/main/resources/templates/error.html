<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — AdwFlow</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/brand-motion.css}">
    <script th:src="@{/js/brand-motion.js}" defer></script>
</head>
<body>
    <header th:replace="~{fragments/navigation :: header}"></header>
    <main class="account-single container">
        <section class="account-card error-card" aria-labelledby="error-title">
            <span class="account-kicker">A SMALL DETOUR</span>
            <h1 id="error-title">We couldn't<br><span>open that page.</span></h1>
            <p class="card-description">The page may be unavailable. Return home and try again.</p>
            <a class="button button-primary" th:href="@{/}">Back to home</a>
        </section>
    </main>
</body>
</html>
