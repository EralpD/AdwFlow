# Activate with SPRING_PROFILES_ACTIVE=langfuse.
# LANGFUSE_AUTH_STRING must be the Base64 encoding of
# "<public-key>:<secret-key>". Never commit the raw keys or this value.

management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${LANGFUSE_OTEL_TRACES_ENDPOINT:https://cloud.langfuse.com/api/public/otel/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.headers.Authorization=Basic ${LANGFUSE_AUTH_STRING}
management.opentelemetry.tracing.export.otlp.headers.x-langfuse-ingestion-version=4

# Langfuse's OTLP endpoint accepts traces, not Micrometer metrics. Keep the
# metrics exporter off for this profile unless a separate metrics endpoint is
# configured explicitly.
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}
