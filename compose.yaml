services:
  postgres:
    image: postgres:17-alpine
    container_name: adwflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-adwflow}
      POSTGRES_USER: ${DB_USERNAME:-adwflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: adwflow-redis
    restart: unless-stopped
    user: redis:redis
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # No disk persistence: expired/consumed security credentials must not reappear after a restart.
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$REDIS_PASSWORD" || { echo 'Configure REDIS_PASSWORD before starting Redis.' >&2; exit 1; }
        case "$$REDIS_PASSWORD" in *[!A-Za-z0-9+/=_-]*) echo 'Use a Base64/URL-safe Redis password.' >&2; exit 1 ;; esac
        umask 077
        printf 'requirepass "%s"\nsave ""\nappendonly no\nmaxmemory 128mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  observability:
    image: grafana/otel-lgtm:latest
    container_name: ad-studio-observability
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - observability-data:/data

volumes:
  postgres-data:
  observability-data:
